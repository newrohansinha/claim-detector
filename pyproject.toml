[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "claim-detector"
version = "0.1.0"
description = "Threshold transfer analysis and deployment of a factual claim detector"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Rohan Sinha" }]
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=2.0,<3",
  "torch==2.8.0",
  "transformers==4.55.4",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
research = [
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "seaborn>=0.13,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "httpx2>=2.12,<3",
  "mypy>=1.13,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-openpyxl>=3.1,<4",
]

[project.scripts]
claim-download = "claim_detector.data.download:main"
claim-prepare = "claim_detector.data.prepare:main"
claim-audit = "claim_detector.analysis.audit:main"
claim-baseline = "claim_detector.models.tfidf:main"
claim-train-bert = "claim_detector.models.bert:main"
claim-train-bert-heldout = "claim_detector.models.bert_transfer:main"
claim-train-bert-control = "claim_detector.models.bert_control:main"
claim-source-probe = "claim_detector.analysis.source_probe:main"
claim-calibrate = "claim_detector.evaluation.calibration:main"
claim-adapt-threshold = "claim_detector.evaluation.threshold_adaptation:main"
claim-api = "claim_detector.api.serve:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claim_detector"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
markers = [
  "model_artifact: tests that load the locally trained BERT checkpoint",
  "real_data: tests that validate downloaded upstream research artifacts",
]

[tool.coverage.run]
branch = true
source = ["claim_detector"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["joblib", "scipy.*", "seaborn", "sklearn.*", "transformers"]
ignore_missing_imports = true
